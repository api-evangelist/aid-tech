aid: aid-tech
name: AID:Tech
description: 'AID:Tech is a Dublin-based payments and digital-identity infrastructure company that bridges
  Web2 and Web3, delivering self-sovereign decentralized identity (DID), KYC/AML verification, digital wallets
  with virtual cards, and secure payouts for benefits distribution, disaster relief, and financial inclusion.
  Its products include Kare (benefits and disaster-relief distribution) and Klimify, and its engineering is
  rooted in blockchain and distributed-ledger technology (Hyperledger Fabric, Openchain, and the bryk/algo DID
  methods). AID:Tech does not publish a first-party public developer API, OpenAPI specification, or developer
  portal; its public technical surface is its GitHub organization (DID-method reference implementations, a Circle
  API SDK, and Kubernetes/Hyperledger tooling) and its Medium engineering blog.'
